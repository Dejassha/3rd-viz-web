# Thirdvizion Website - nginx site config (FRONTEND ONLY, dev mode)
# Frontend: Next.js dev server on 127.0.0.1:3003 (`pnpm dev` = `next dev -p 3003`)
# No CMS / backend needed - site renders with fallback data.
#
# Install as thirdvizion-web.conf:
#   sudo cp nginx-thirdvizion-web.conf /etc/nginx/sites-available/thirdvizion-web.conf
#   sudo ln -sf /etc/nginx/sites-available/thirdvizion-web.conf /etc/nginx/sites-enabled/thirdvizion-web.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   # HTTPS (first time only):
#   sudo certbot --nginx -d thirdvizion-website.example.com
#
# Why pages/API/images break (same bug class as the Sakthi ERP config):
# 1. proxy_pass http://127.0.0.1:3003/ (with trailing slash) strips/rewrites
#    the URI, so /api/contact -> /contact (404) and /_next/static/... 404s.
#    Must be WITHOUT trailing slash to forward the URI untouched.
# 2. Do NOT use `root .../dist + try_files $uri /index.html` here like a Vite SPA.
#    This is Next.js - everything (SSR, /_next/*, /api/*) is rendered
#    by Node on :3003. nginx must reverse-proxy, not serve static files.
# 3. Prod switch: `pnpm build && pnpm start` runs on :3005.
#    Then change `upstream` above to 127.0.0.1:3005 and reload nginx.

upstream thirdvizion_web {
    server 127.0.0.1:3003;
    keepalive 32;
}

server {
    listen 80;
    server_name thirdvizion-website.example.com;

    client_max_body_size 25M;

    # Next.js static build output - immutable, cache aggressively
    location /_next/static/ {
        proxy_pass http://thirdvizion_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (SSR pages, /api/*, public/*, image optimizer) -> Node
    # NO trailing slash on proxy_pass - preserve URI exactly
    location / {
        proxy_pass http://thirdvizion_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
